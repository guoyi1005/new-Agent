# ============================================
# 环境变量说明
# ============================================
# 敏感配置已迁移至环境变量，不在代码中硬编码
# 本地开发时可通过以下方式设置：
# 1. 设置系统环境变量
# 2. 在项目根目录创建 .env 文件（已被 .gitignore 忽略）
# 3. 使用 IDE 的 Run Configuration 设置环境变量
# ============================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: AppBackend
  task:
    scheduling:
      # 岗位雷达一轮抓取要几分钟，单独给调度线程池留出余量，
      # 避免和成都本地就业抓取互相排队
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:2}
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart-campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 500MB
  data:
    neo4j:
      repositories:
        type: none
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j-dev-password}

# JWT 认证配置
# JWT_SECRET: JWT 签名密钥，生产环境务必修改
# JWT_EXPIRATION_MS: Token 过期时间（毫秒）
jwt:
  secret: ${JWT_SECRET:dev-local-jwt-secret-change-before-production-2026}
  expiration: ${JWT_EXPIRATION_MS:86400000}

# 腾讯云配置
# TENCENT_MAP_KEY: 腾讯地图 API Key
# TENCENT_COS_SECRET_ID/SECRET_KEY: COS 存储密钥
# TENCENT_COS_BUCKET/DOMAIN: COS Bucket 名称和域名
tencent:
  map:
    key: ${TENCENT_MAP_KEY:}
    base-url: https://apis.map.qq.com
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    region: ${TENCENT_COS_REGION:ap-beijing}
    bucket: ${TENCENT_COS_BUCKET:}
    domain: ${TENCENT_COS_DOMAIN:}
    upload-prefix: smart-campus/media
    map-buildings-prefix: smart-campus/map-buildings

# 高德地图配置
# AMAP_APP_KEY: 移动端 API Key
# AMAP_WEB_KEY: Web 端 API Key
amap:
  app:
    key: ${AMAP_APP_KEY:}
  web:
    key: ${AMAP_WEB_KEY:}
    base-url: https://restapi.amap.com

ai:
  python:
    base-url: ${AI_PYTHON_BASE_URL:http://localhost:8081}
    timeout-seconds: ${AI_PYTHON_TIMEOUT_SECONDS:180}
    ppt-timeout-seconds: ${AI_PYTHON_PPT_TIMEOUT_SECONDS:300}
    file-response-max-in-memory-bytes: ${AI_PYTHON_FILE_RESPONSE_MAX_IN_MEMORY_BYTES:52428800}
    max-in-memory-bytes: ${AI_PYTHON_MAX_IN_MEMORY_BYTES:52428800}
    internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token-change-me-32chars}
  assistant:
    public-resource-hosts: ${AI_ASSISTANT_PUBLIC_RESOURCE_HOSTS:}

job-recommendation:
  weekly:
    cron: ${JOB_RECOMMENDATION_WEEKLY_CRON:0 0 6 ? * MON}
  learning:
    workflow:
      fallback-max-entries: ${AI_LEARNING_WORKFLOW_FALLBACK_MAX_ENTRIES:1024}

knowledge:
  graph:
    neo4j:
      enabled: ${NEO4J_ENABLED:false}
  maxkb:
    timeout-seconds: ${KNOWLEDGE_MAXKB_TIMEOUT_SECONDS:30}
    file-response-max-in-memory-bytes: ${KNOWLEDGE_MAXKB_FILE_RESPONSE_MAX_IN_MEMORY_BYTES:52428800}
    retrieval-cache:
      ttl-seconds: ${KNOWLEDGE_MAXKB_RETRIEVAL_CACHE_TTL_SECONDS:300}
      max-entries: ${KNOWLEDGE_MAXKB_RETRIEVAL_CACHE_MAX_ENTRIES:500}

# 阿里云 OSS 配置
# ALIYUN_OSS_BUCKET_NAME: OSS Bucket 名称
# ALIYUN_OSS_ACCESS_KEY_ID/ACCESS_KEY_SECRET: OSS 密钥
# ALIYUN_OSS_BASE_URL: OSS 访问域名
aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    base-url: ${ALIYUN_OSS_BASE_URL:}

file:
  upload-dir: uploads
  base-url: ${FILE_BASE_URL:http://localhost:8080}

# 课程资料上传配置（文件夹大小上限与扩展名白名单，便于后期调整）
# max-folder-bytes: 同一文件夹（同一 upload_batch_id）累计字节上限，默认 2GB
# 注意：单请求体积仍受 spring.servlet.multipart 上限限制，需前端分批上传
course-material:
  max-folder-bytes: ${COURSE_MATERIAL_MAX_FOLDER_BYTES:2147483648}
  allowed-extensions: ${COURSE_MATERIAL_ALLOWED_EXTENSIONS:mp4,avi,pdf,ppt,pptx,doc,docx,xls,xlsx,png,jpg,jpeg,gif,webp,mp3,txt}
  storage-prefix: ${COURSE_MATERIAL_STORAGE_PREFIX:smart-campus/course-materials}

browser:
  headless: true  # 可视化浏览器，调试用
  default-url: https://jwx.hebiace.edu.cn/

exam-paper:
  preview:
    soffice-path: ${EXAM_PAPER_PREVIEW_SOFFICE_PATH:soffice}
    timeout-seconds: ${EXAM_PAPER_PREVIEW_TIMEOUT_SECONDS:30}
    root: ${EXAM_PAPER_PREVIEW_ROOT:${java.io.tmpdir}/agent-a3-exam-preview}
    ttl-minutes: ${EXAM_PAPER_PREVIEW_TTL_MINUTES:30}
    cleanup-interval-ms: ${EXAM_PAPER_PREVIEW_CLEANUP_INTERVAL_MS:60000}

exam:
  question-generation:
    max-file-bytes: 10485760
    max-text-characters: 200000
    max-zip-entry-bytes: 16777216
    max-zip-total-bytes: 52428800
    max-zip-entries: 2000

interview:
  # DeepSeek 凭据仅从环境变量读取（DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL / DEEPSEEK_MODEL），仓库内不保存密钥。
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    api-key: ${DEEPSEEK_API_KEY:}
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8001}
    collection: ${CHROMA_COLLECTION_NAME:knowledge_base}
  tencent:
    secret-id: ${TENCENTCLOUD_SECRET_ID:}
    secret-key: ${TENCENTCLOUD_SECRET_KEY:}
    app-id: ${TENCENTR_APP_ID:}
    region: ${TENCENTCLOUD_REGION:ap-guangzhou}
    asr-model: ${TENCENTCLOUD_ASR_MODEL:}
    voice-type: ${VOICETYPE:}
    codec: ${CODEC:pcm}
    sample-rate: ${SAMPLE_RATE:16000}
  avatar:
    app-id: ${XFY_AVATAR_APP_ID:}
    api-key: ${XFY_AVATAR_API_KEY:}
    api-secret: ${XFY_AVATAR_API_SECRET:}
    scene-id: ${XFY_SCENE_ID:}
    server-url: ${XFY_SERVER_URL:}
    avatar-id: ${XFY_AVATAR_ID:}
    stream-protocol: ${XFY_STREAM_PROTOCOL:webrtc}
    opening-greeting: ${XFY_OPENING_GREETING:}
  face:
    records-dir: ${INTERVIEW_FACE_RECORDS_DIR:./data/interview-face-records}
  asr:
    upload-dir: ${INTERVIEW_ASR_UPLOAD_DIR:./data/interview-asr}

springdoc:
  api-docs:
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

# 成都本地就业岗位：每天定时从公共招聘网站抓取公开展示的岗位信息。
# 只记录岗位名、单位、区域、薪资、学历等公开字段，不抓取联系方式。
local-job:
  crawl:
    enabled: ${LOCAL_JOB_CRAWL_ENABLED:true}
    cron: ${LOCAL_JOB_CRAWL_CRON:0 30 5 * * ?}
    timeout-seconds: ${LOCAL_JOB_CRAWL_TIMEOUT_SECONDS:25}
    # 每次翻页之间的间隔：招聘网站对短时间内的连续请求会返回 429，这里放慢一些
    pause-millis: ${LOCAL_JOB_CRAWL_PAUSE_MILLIS:1500}
    bootstrap-delay-ms: ${LOCAL_JOB_CRAWL_BOOTSTRAP_DELAY_MS:60000}
    bootstrap-interval-ms: ${LOCAL_JOB_CRAWL_BOOTSTRAP_INTERVAL_MS:3600000}
    # 最近一次抓取超过这个小时数，服务启动/巡检时会自动补抓（避免错过当天定时任务）
    stale-hours: ${LOCAL_JOB_CRAWL_STALE_HOURS:12}
    # 各站最新页以非技术岗为主，额外用这些方向关键词各抓一页，保证库里也有学生目标方向的岗位
    direction-keywords: ${LOCAL_JOB_CRAWL_DIRECTION_KEYWORDS:Python,Java,前端,数据}
    rc114:      # 成都人才网
      enabled: ${LOCAL_JOB_CRAWL_RC114_ENABLED:true}
      pages: ${LOCAL_JOB_CRAWL_RC114_PAGES:2}
    cd-sc91:    # 成都公共招聘网
      enabled: ${LOCAL_JOB_CRAWL_CD_SC91_ENABLED:true}
      pages: ${LOCAL_JOB_CRAWL_CD_SC91_PAGES:2}
    sc91:       # 四川公共招聘网（成都岗位）
      enabled: ${LOCAL_JOB_CRAWL_SC91_ENABLED:true}
      pages: ${LOCAL_JOB_CRAWL_SC91_PAGES:2}

# 岗位雷达：每天定时抓取实习岗位（实习僧公开列表页与职位详情页），
# 供就业页「为你推荐的岗位」与「热门岗位」使用。
# 只抓公开展示的岗位字段，不登录、不带 Cookie、不研究字体混淆；
# 数据量不足或想临时补数据时，可用管理端 POST /api/admin/jobs/radar/refresh 手动跑一次。
market-job:
  radar:
    enabled: ${MARKET_JOB_RADAR_ENABLED:true}
    cron: ${MARKET_JOB_RADAR_CRON:0 40 5 * * ?}
    keywords: ${MARKET_JOB_RADAR_KEYWORDS:Python,Java,前端,数据分析,产品经理,大模型}
    # 每个关键词最多取多少条详情；单轮总请求上限见 max-detail-requests
    per-keyword-limit: ${MARKET_JOB_RADAR_PER_KEYWORD_LIMIT:12}
    max-detail-requests: ${MARKET_JOB_RADAR_MAX_DETAIL_REQUESTS:120}
    # 请求间隔：站点对连续请求敏感，默认 1.5-3 秒随机等待
    min-delay-millis: ${MARKET_JOB_RADAR_MIN_DELAY_MILLIS:1500}
    max-delay-millis: ${MARKET_JOB_RADAR_MAX_DELAY_MILLIS:3000}
    # 只保留最近这个天数内刷新的岗位，与人工抓取时的口径一致
    max-age-days: ${MARKET_JOB_RADAR_MAX_AGE_DAYS:90}
    # 站点搜索是模糊匹配，会带出餐饮/行政等无关实习；开启后要求岗位命中方向关键词或两项以上技术栈
    require-direction-match: ${MARKET_JOB_RADAR_REQUIRE_DIRECTION_MATCH:true}
    timeout-seconds: ${MARKET_JOB_RADAR_TIMEOUT_SECONDS:25}
    user-agent: ${MARKET_JOB_RADAR_USER_AGENT:CampusJobResearch/1.0}
    # 最近一次抓取超过这个小时数就补抓一次（服务启动后也会检查）
    stale-hours: ${MARKET_JOB_RADAR_STALE_HOURS:24}
    bootstrap-delay-ms: ${MARKET_JOB_RADAR_BOOTSTRAP_DELAY_MS:120000}
    bootstrap-interval-ms: ${MARKET_JOB_RADAR_BOOTSTRAP_INTERVAL_MS:3600000}
