name: smart-campus

services:
  adminer:
    container_name: smart-campus-adminer
    image: docker.m.daocloud.io/library/adminer:latest
    restart: always
    ports:
      - "${ADMINER_PORT:-7070}:8080"


  code-judge:
    container_name: smart-campus-code-judge
    build:
      context: ./code-runner
    restart: always
    environment:
      CODE_JUDGE_INTERNAL_TOKEN: "${CODE_JUDGE_INTERNAL_TOKEN:-dev-code-judge-token-change-me}"
      CODE_JUDGE_TIMEOUT_SECONDS: "${CODE_JUDGE_TIMEOUT_SECONDS:-5}"
    ports:
      - "127.0.0.1:${CODE_JUDGE_PORT:-8099}:8099"
    networks:
      - judge
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  mysql:
    container_name: smart-campus-mysql
    image: docker.m.daocloud.io/library/mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-smart-campus}"
    command:
      - --character-set-server=${MYSQL_CHARSET:-utf8mb4}
      - --collation-server=${MYSQL_COLLATION:-utf8mb4_unicode_ci}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - ./.mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    container_name: smart-campus-redis
    image: docker.m.daocloud.io/library/redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./.redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  neo4j:
    container_name: smart-campus-neo4j
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-neo4j-dev-password}"
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - ./.neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "password=\"$${NEO4J_AUTH#*/}\"; cypher-shell -u neo4j -p \"$$password\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    profiles: ["deploy"]
    image: ${BACKEND_IMAGE:-crpi-awzm63dqn5ugddo8.cn-hangzhou.personal.cr.aliyuncs.com/lukezhang/appbackend}:${IMAGE_TAG:-latest}
    container_name: smart-campus-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      code-judge:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-smart-campus}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      NEO4J_ENABLED: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j-dev-password}
      AI_PYTHON_BASE_URL: ${AI_PYTHON_BASE_URL:-http://host.docker.internal:8081}
      CODE_JUDGE_BASE_URL: ${CODE_JUDGE_BASE_URL:-http://code-judge:8099}
      CODE_JUDGE_INTERNAL_TOKEN: ${CODE_JUDGE_INTERNAL_TOKEN:-dev-code-judge-token-change-me}
      CODE_JUDGE_LOCAL_FALLBACK: "false"
      # AI 面试官所用的 DeepSeek 凭据只从 .env / 环境变量读取，仓库内不保存密钥。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      FILE_BASE_URL: ${FILE_BASE_URL:-http://localhost}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - judge
    volumes:
      - ./uploads:/app/uploads

  web:
    profiles: ["deploy"]
    image: ${WEB_IMAGE:-crpi-awzm63dqn5ugddo8.cn-hangzhou.personal.cr.aliyuncs.com/lukezhang/appweb}:${IMAGE_TAG:-latest}
    container_name: smart-campus-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

networks:
  judge:
    internal: true
